name: Build and verify PocketMinGW
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run toolchain
      - run: npm run check
      - run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release && cmake --build native/build -j 4
      - run: node scripts/test-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: artifacts/native-tests
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: npm ci && npm run toolchain && npm run build && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PocketMinGW-Android12-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run toolchain && npm run build && npx cap sync ios && node scripts/configure-native.mjs
      - name: Compile iPhone app without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath artifacts/ios CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.0 build
      - name: Package unsigned iPhone app
        run: |
          mkdir -p artifacts/iphone/Payload
          cp -R artifacts/ios/Build/Products/Release-iphoneos/App.app artifacts/iphone/Payload/
          cd artifacts/iphone && zip -qry ../PocketMinGW-iOS16-UNSIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PocketMinGW-iOS16-unsigned
          path: artifacts/PocketMinGW-iOS16-UNSIGNED.ipa
