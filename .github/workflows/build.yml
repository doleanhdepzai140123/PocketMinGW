name: Build and verify PocketMinGW
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Build target
        type: choice
        default: all
        options: [all, android, ios, verify]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run toolchain && npm run pch
      - run: npm run check
      - run: npx playwright install --with-deps chrome && npm run test:e2e
      - run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release && cmake --build native/build -j 4
      - run: node scripts/test-native.mjs
      - name: Compile under a 1 GiB process address-space ceiling
        run: |
          prlimit --as=1073741824 native/build/pocket-cli public/toolchain tests/native-basic.json > artifacts/native-tests/bounded-address-space.result.json
          node -e 'const r=require("./artifacts/native-tests/bounded-address-space.result.json"); console.log(r); if(r.error || r.exitCode !== 0 || r.stdout !== "123 4\n") process.exit(1)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            artifacts/native-tests
            artifacts/pch-provenance.json
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: npm ci && npm run toolchain && npm run pch && npm run build && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon && mkdir -p ../artifacts && adb install -r app/build/outputs/apk/debug/app-debug.apk && adb shell am start -W -n com.pocketmingw.ide/.MainActivity && sleep 3 && adb shell screencap -p /sdcard/pocketmingw.png && adb pull /sdcard/pocketmingw.png ../artifacts/android-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android12-test-report
          path: |
            android/app/build/reports/androidTests
            artifacts/android-screen.png
      - uses: actions/upload-artifact@v4
        with:
          name: PocketMinGW-Android12-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run toolchain && npm run pch && npm run build && npx cap sync ios && node scripts/configure-native.mjs
      - name: Compile iPhone app without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath artifacts/ios CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.0 build
      - name: Package unsigned iPhone app
        run: |
          mkdir -p artifacts/iphone/Payload
          cp -R artifacts/ios/Build/Products/Release-iphoneos/App.app artifacts/iphone/Payload/
          cd artifacts/iphone && zip -qry ../PocketMinGW-iOS16-UNSIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PocketMinGW-iOS16-unsigned
          path: artifacts/PocketMinGW-iOS16-UNSIGNED.ipa
      - name: Build and run iPhone simulator smoke test
        run: bash scripts/test-ios-simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-test
          path: |
            artifacts/ios-simulator-result.json
            artifacts/ios-screen.png
            artifacts/ios-keyboard*.json
            artifacts/ios-keyboard.png
            artifacts/ios-simulator-build.log
